<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign up - Udemy</title>

    <link rel="stylesheet" href="prject1.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

</head>

<body class="auth-body">

    <div class="auth-container">

        <!-- LEFT SIDE -->
        <div class="auth-left">

            <a href="index.html" class="auth-logo">
                Udemy
            </a>

            <h1>
                Create an account
                and start learning
            </h1>

            <p>
                Join millions of learners and
                discover courses for your career.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="auth-right">

            <div class="auth-box">

                <h2>
                    Sign up
                </h2>

                <form>

                    <label for="fullname">
                        Full name
                    </label>

                    <input
                        id="fullname"
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="signup-email">
                        Email
                    </label>

                    <input
                        id="signup-email"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="signup-password">
                        Password
                    </label>

                    <input
                        id="signup-password"
                        type="password"
                        placeholder="Create a password"
                        required
                    >


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Sign up
                    </button>

                </form>


                <p class="account-text">
                    Already have an account?
                    <a href="login.html">
                        Log in
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
